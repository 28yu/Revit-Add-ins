name: Build and Release
run-name: "${{ github.event.inputs.test_only == 'true' && '🔨 テストビルド' || 'ビルド＆リリース' }} ${{ github.ref_name }}"

on:
  # タグ push で自動リリース (例: git tag v1.0 && git push --tags)
  push:
    tags:
      - 'v*'
    # release/v* ブランチ push でもリリース (Claude Code環境用)
    # build/* ブランチ push でテストビルドのみ (リリースなし)
    branches:
      - 'release/v*'
      - 'build/*'
  # 手動実行も可能
  workflow_dispatch:
    inputs:
      version:
        description: 'リリースバージョン (例: 1.0)'
        required: true
        default: '1.0'
      test_only:
        description: 'テストビルドのみ（リリースしない）'
        type: boolean
        default: false
      since:
        description: '前回リリースバージョン (例: 2.2)。空なら直近のタグから自動判定'
        required: false
        default: ''

jobs:
  # バージョンを1箇所で決める。build / release の両方から参照する。
  version:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.v.outputs.version }}
      since: ${{ steps.v.outputs.since }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0   # 直近タグから since を求めるため全履歴が必要

      - name: Determine version
        id: v
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            VERSION="${{ github.event.inputs.version }}"
          elif [[ "${{ github.ref }}" == refs/tags/v* || "${{ github.ref }}" == refs/heads/release/v* ]]; then
            REF="${{ github.ref_name }}"
            REF="${REF#release/}"
            VERSION="${REF#v}"
          else
            VERSION=""   # build/* のテストビルドはバージョン無し（スタンプもリリースもしない）
          fi
          echo "version=$VERSION" >> $GITHUB_OUTPUT

          # ⭐新機能の判定基準となる「前回リリース」。
          # 未リリースのまま added_in だけ進んだ機能を取りこぼさないため、
          # 「前回リリースより新しい added_in」を全て新機能として扱う。
          SINCE="${{ github.event.inputs.since }}"
          if [ -z "$SINCE" ] && [ -n "$VERSION" ]; then
            SINCE=$(git tag -l 'v*' --sort=-v:refname | grep -v "^v${VERSION}$" | head -1 | sed 's/^v//')
          fi
          echo "since=$SINCE" >> $GITHUB_OUTPUT
          echo "version=$VERSION / since=$SINCE"

  build:
    needs: version
    runs-on: windows-latest

    strategy:
      fail-fast: false
      matrix:
        revit-version: ['2021', '2022', '2023', '2024', '2025', '2026']

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET 8 SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Setup MSBuild
        uses: microsoft/setup-msbuild@v2

      # AssemblyInfo.cs は GenerateAssemblyInfo=false のため MSBuild の /p:Version が効かない。
      # バージョン情報ダイアログの表記が取り残されないよう、ビルド直前にリリースバージョンを書き込む。
      # （インストーラ側のバージョンは installer ジョブが ISCC の /DAppVersion で渡す）
      - name: Stamp version into sources
        if: needs.version.outputs.version != ''
        shell: bash
        run: |
          set -e
          V="${{ needs.version.outputs.version }}"

          sed -i "s/AssemblyVersion(\"[^\"]*\")/AssemblyVersion(\"${V}.0\")/"         Properties/AssemblyInfo.cs
          sed -i "s/AssemblyFileVersion(\"[^\"]*\")/AssemblyFileVersion(\"${V}.0\")/" Properties/AssemblyInfo.cs

          grep -q "AssemblyVersion(\"${V}.0\")" Properties/AssemblyInfo.cs \
            || { echo "::error::AssemblyInfo へのバージョン反映に失敗しました"; exit 1; }
          echo "スタンプ完了: v${V}"

      # 期限切れ間近のビルドを配布してしまわないためのガード（CLAUDE.md のリリース手順）。
      - name: Check expiry date
        if: needs.version.outputs.version != '' && matrix.revit-version == '2024'
        shell: bash
        run: python3 scripts/check-expiry.py --warn-days 180 --fail-days 30

      - name: Build for Revit ${{ matrix.revit-version }}
        run: |
          dotnet build Tools28.csproj `
            -c Release `
            /p:RevitVersion=${{ matrix.revit-version }}

      # インストーラ（installer ジョブ）の材料。手動インストール用にもそのまま使える構成:
      #   28Tools/*.dll + 28Tools/Tools28.addin
      - name: Collect build output
        shell: pwsh
        run: |
          $ver = "${{ matrix.revit-version }}"
          $tools28Dir = "artifact/28Tools"
          New-Item -ItemType Directory -Path $tools28Dir -Force | Out-Null

          # 全DLL（Tools28.dll + ClosedXML等の依存ライブラリ）
          Copy-Item "bin/Release/Revit$ver/*.dll" "$tools28Dir/"
          Copy-Item "Packages/$ver/28Tools/Tools28.addin" "$tools28Dir/Tools28.addin"

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: 28Tools_Revit${{ matrix.revit-version }}
          path: artifact/

  # 全6バージョンを 1 本のインストーラ（28Tools_Setup_v<ver>.exe）にまとめる。
  # build/* のテストビルドでも作るので、リリース前に exe を Actions の Artifacts から試せる。
  installer:
    needs: [version, build]
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Download build artifacts
        uses: actions/download-artifact@v4
        with:
          pattern: 28Tools_Revit*
          path: artifacts

      # Installer/28Tools.iss は <BinRoot>\Revit<ver>\*.dll を取り込む。その形に並べ直す。
      - name: Stage files
        shell: pwsh
        run: |
          foreach ($ver in 2021..2026) {
            $src = "artifacts/28Tools_Revit$ver/28Tools"
            $dst = "stage/Revit$ver"
            if (-not (Test-Path "$src/Tools28.dll")) {
              Write-Error "Revit $ver のビルド成果物がありません: $src"
              exit 1
            }
            New-Item -ItemType Directory -Path $dst -Force | Out-Null
            Copy-Item "$src/*.dll" "$dst/"
          }
          Get-ChildItem stage -Recurse -Filter Tools28.dll | ForEach-Object { $_.FullName }

      # windows-latest には Inno Setup 6 が入っている想定。無い場合・中国語の言語ファイル
      # （Inno Setup 6.5 以降で同梱）が無い場合は choco で入れる／更新する。
      # 更新に失敗しても .iss 側が中国語を省いてビルドを続けるので、ここでは止めない。
      - name: Setup Inno Setup
        id: inno
        shell: pwsh
        run: |
          function Find-Iscc {
            $cmd = Get-Command iscc -ErrorAction SilentlyContinue
            if ($cmd) { return $cmd.Source }
            foreach ($p in @("${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe", "$env:ProgramFiles\Inno Setup 6\ISCC.exe")) {
              if (Test-Path $p) { return $p }
            }
            return $null
          }
          $iscc = Find-Iscc
          $hasZh = $iscc -and (Test-Path (Join-Path (Split-Path $iscc) "Languages\ChineseSimplified.isl"))
          if (-not $iscc -or -not $hasZh) {
            Write-Host "Inno Setup をインストール／更新します（ISCC=$iscc, 中国語=$hasZh）"
            choco upgrade innosetup -y --no-progress
            if ($LASTEXITCODE -ne 0) { Write-Warning "choco が失敗しました ($LASTEXITCODE)。既存の Inno Setup で続行します" }
            $global:LASTEXITCODE = 0
            $iscc = Find-Iscc
          }
          if (-not $iscc) { Write-Error "ISCC.exe が見つかりません"; exit 1 }
          Write-Host "ISCC: $iscc"
          "iscc=$iscc" >> $env:GITHUB_OUTPUT

      - name: Compile installer
        shell: pwsh
        run: |
          $v = "${{ needs.version.outputs.version }}"
          if (-not $v) { $v = "0.0-test" }   # build/* のテストビルド
          & "${{ steps.inno.outputs.iscc }}" "/DAppVersion=$v" "/DBinRoot=$PWD\stage" "Installer\28Tools.iss"
          if ($LASTEXITCODE -ne 0) { Write-Error "ISCC が失敗しました ($LASTEXITCODE)"; exit 1 }

          $exe = "Installer/Output/28Tools_Setup_v$v.exe"
          if (-not (Test-Path $exe)) { Write-Error "インストーラが生成されていません: $exe"; exit 1 }
          New-Item -ItemType Directory -Path dist -Force | Out-Null
          Copy-Item $exe dist/
          $size = [math]::Round((Get-Item $exe).Length / 1MB, 2)
          Write-Host "作成: $exe ($size MB)"

      - name: Upload installer
        uses: actions/upload-artifact@v4
        with:
          name: 28Tools_Setup
          path: dist/*.exe

  release:
    needs: [version, installer]
    runs-on: ubuntu-latest
    if: (startsWith(github.ref, 'refs/tags/v') || startsWith(github.ref, 'refs/heads/release/v') || github.event_name == 'workflow_dispatch') && github.event.inputs.test_only != 'true'
    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Generate release body
        run: |
          SINCE_ARG=""
          if [ -n "${{ needs.version.outputs.since }}" ]; then
            SINCE_ARG="--since ${{ needs.version.outputs.since }}"
          fi
          python3 scripts/generate-release-body.py \
            --version ${{ needs.version.outputs.version }} \
            $SINCE_ARG \
            --features Docs/features.json \
            > release-body.md
          cat release-body.md

      # 配布物はインストーラ exe 1 本だけ（バージョン別 ZIP は廃止）
      - name: Download installer
        uses: actions/download-artifact@v4
        with:
          name: 28Tools_Setup
          path: dist

      - name: Check installer
        run: |
          ls -la dist/
          test -f "dist/28Tools_Setup_v${{ needs.version.outputs.version }}.exe" \
            || { echo "::error::インストーラ exe がありません"; exit 1; }

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          name: "28 Tools v${{ needs.version.outputs.version }}"
          body_path: release-body.md
          files: dist/*.exe
          tag_name: v${{ needs.version.outputs.version }}
          generate_release_notes: false
          # 下書き。サイトのダウンロードボタンは releases/latest（公開済みの最新）を読むため、
          # 公開ボタンを押すまでサイトには反映されない
          draft: true
          # 下書きで作る（一般公開しない）。SmartScreen の誤検知確認・報告が済んでから
          # GitHub のリリース画面で「Publish release」を押して公開する。
          # 下書きの間はタグが作られないため、公開時の対象コミットをここで固定しておく
          draft: true
          target_commitish: ${{ github.sha }}

      - name: Upload to download site (28tools-download)
        uses: softprops/action-gh-release@v2
        with:
          token: ${{ secrets.DOWNLOAD_SITE_TOKEN }}
          repository: 28yu/28tools-download
          name: "28 Tools v${{ needs.version.outputs.version }}"
          body_path: release-body.md
          files: dist/*.exe
          tag_name: v${{ needs.version.outputs.version }}
          generate_release_notes: false

      - name: Delete release branch
        if: startsWith(github.ref, 'refs/heads/release/v')
        run: git push origin --delete "${{ github.ref_name }}" || true
